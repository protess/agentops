[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
# sqlx 0.9.0 declares rust-version = 1.94. Anything lower fails immediately with
# "sqlx@0.9.0 requires rustc 1.94.0".
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/protess/agentops"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "macros"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures-core = "0.3"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros",
] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
askama = "0.16.0"
tokio-stream = "0.1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
