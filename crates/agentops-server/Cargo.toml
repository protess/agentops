[package]
name = "agentops-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
agentops-core = { path = "../agentops-core" }
agentops-store = { path = "../agentops-store" }
agentops-agent = { path = "../agentops-agent" }
axum.workspace = true
tower-http.workspace = true
askama.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# `CancellationToken` — propagates the JobManager's shutdown signal (Tasks 5 and 6).
tokio-util = { version = "0.7", features = ["rt"] }
# `AssertUnwindSafe(...).catch_unwind()` — catches a panicking investigation task and marks
# it `failed` (plan 2 already uses this in the workspace).
futures-util = "0.3"

[dev-dependencies]
async-trait.workspace = true
# `ServiceExt::oneshot` — drives the router with a single request and no real server
# (`tests/pages.rs`). It is not a workspace dependency, so the version is pinned here.
tower = { version = "0.5", features = ["util"] }
