[package]
name = "agentops-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
agentops-core = { path = "../agentops-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures-core.workspace = true
futures-util = "0.3"
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
  "json", "rustls-tls", "stream",
] }
tracing = "0.1"
# rmcp 3.0.1 is the latest on crates.io (docs.rs may show 2.2.0 — a cache lag).
# Only `RmcpConnection` (mcp_client.rs) references this crate.
rmcp = { version = "3.0", features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
agentops-store = { path = "../agentops-store" }
sqlx.workspace = true
